<!-- SIDE CONTACT FORM -->
<div class="side-contact-form" id="sideContactForm">

	<div class="contact-form-header">
		<span class="close-contact-form" id="closeContactForm">
			<img src="{{ASSET}}images/close_cross.svg" alt="close">
		</span>
	</div>
	<form class="contact-form-fields">

	<!-- YOUR REQUEST -->
	<h3 class="contact-section-title">YOUR REQUEST</h3>

	<div class="ps-field-row single">
		<div class="ps-field ps-select">
			<label>WHAT IS YOUR REQUEST? *</label>
			<select name="produit" required>
				<option value="" disabled selected>Please select</option>
				<option value="Bureaux">Executive Offices</option>
				<option value="Expérience by Kwerk">Your building managed by Kwerk</option>
				<option value="Événementiel">Events</option>
			</select>
			<div class="error"></div>
		</div>
	</div>

	<div class="ps-field-row single ps-field-row--desk" style="display:none;">
		<div class="ps-field">
			<label>HOW MANY DESKS DO YOU NEED? *</label>
			<input type="number" name="desk" min="1" placeholder="Number of desks">
			<div class="error"></div>
		</div>
	</div>

	<div class="ps-field-row single ps-field-row--events" style="display:none;">
		<div class="ps-field">
			<label>FOR HOW MANY PEOPLE? *</label>
			<input type="number" name="nombre_de_personnes" min="1" placeholder="Number of people">
			<div class="error"></div>
		</div>
	</div>

	<div class="ps-field-row single">
		<div class="ps-field">
			<label>TELL US ABOUT YOUR PROJECT *</label>
			<textarea name="description_de_la_transaction" placeholder="Tell us about your project" required></textarea>
			<div class="error"></div>
		</div>
	</div>

	<hr class="contact-separator">

	<!-- YOUR DETAILS -->
	<h3 class="contact-section-title">YOUR DETAILS</h3>

	<div class="ps-field-row">
		<div class="ps-field">
			<label>YOUR FIRST NAME *</label>
			<input type="text" name="firstname" placeholder="Your first name" required>
			<div class="error"></div>
		</div>
		<div class="ps-field">
			<label>YOUR LAST NAME *</label>
			<input type="text" name="lastname" placeholder="Your last name" required>
			<div class="error"></div>
		</div>
	</div>

	<div class="ps-field-row">
		<div class="ps-field">
			<label>YOUR PHONE NUMBER *</label>
			<input type="text" name="phone" placeholder="+XX X XX XX XX XX" required>
			<div class="error"></div>
		</div>
		<div class="ps-field">
			<label>YOUR EMAIL ADDRESS *</label>
			<input type="email" name="email" placeholder="name@email.com" required>
			<div class="error"></div>
		</div>
	</div>

	<div class="ps-field-row single">
		<div class="ps-field">
			<label>YOUR COMPANY *</label>
			<input type="text" name="company" placeholder="Company name" required>
			<div class="error"></div>
		</div>
	</div>

	<div class="ps-field-row single">
		<div class="ps-field">
			<label>HOW DID YOU HEAR ABOUT KWERK? *</label>
			<select name="origine_de_la_piste" required>
				<option value="" disabled selected>Please select</option>
				<option value="Recommandation par mon réseau">Recommendation from my network</option>
				<option value="Recherche internet">Internet search</option>
				<option value="Recommandation par un membre Kwerk">Recommendation from a Kwerk member</option>
				<option value="Mis en relation par un broker">Referred by a broker</option>
				<option value="Sur les réseaux sociaux">On social media</option>
				<option value="Rendez-vous professionnel chez Kwerk">Professional meeting at Kwerk</option>
				<option value="Dans la presse">In the press</option>
				<option value="Lors d&#039;un événement chez Kwerk">At a Kwerk event</option>
				<option value="Au cours d&#039;un déjeuner au restaurant Le Dana">During lunch at Le Dana restaurant</option>
			</select>
			<div class="error"></div>
		</div>
	</div>

	<hr class="contact-separator">

	<div class="form-footer">
		<button type="submit" class="submit-btn">SEND YOUR REQUEST</button>
		<div class="success" id="successMessage"></div>
	</div>
	</form>
</div>
