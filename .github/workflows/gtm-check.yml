name: GTM Auto-Insert

on:
  push:
    branches:
      - preprod

jobs:
  gtm-check:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: preprod
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Insert GTM and HubSpot snippets in HTML files
        run: |
          python3 << 'PYEOF'
          import os
          import re

          GTM_ID = 'GTM-MK4BS4GL'

          HS_SCRIPT_ID = 'hs-script-loader'
          HS_CORRECT_SRC = 'https://js-eu1.hs-scripts.com/26225487.js'

          HEAD_SNIPPET = """    <!-- Google Tag Manager -->
          <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
          new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
          'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
          })(window,document,'script','dataLayer','GTM-MK4BS4GL');</script>
          <!-- End Google Tag Manager -->"""

          BODY_SNIPPET = """    <!-- Google Tag Manager (noscript) -->
          <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MK4BS4GL"
          height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
          <!-- End Google Tag Manager (noscript) -->"""

          HS_SNIPPET = """    <!-- Start of HubSpot Embed Code -->
          <script type="text/javascript" id="hs-script-loader" async defer src="https://js-eu1.hs-scripts.com/26225487.js"></script>
          <!-- End of HubSpot Embed Code -->"""

          modified = []

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if not d.startswith('.')]
              for fname in files:
                  if not fname.endswith('.html'):
                      continue
                  fpath = os.path.join(root, fname)
                  with open(fpath, 'r', encoding='utf-8', errors='replace') as f:
                      content = f.read()

                  original = content

                  # --- GTM check ---
                  if GTM_ID not in content:
                      charset_match = re.search(r'(<meta\s+charset[^>]*>)', content, re.IGNORECASE)
                      head_match = re.search(r'(<head[^>]*>)', content, re.IGNORECASE)

                      if charset_match:
                          insert_pos = charset_match.end()
                          content = content[:insert_pos] + '\n' + HEAD_SNIPPET + content[insert_pos:]
                      elif head_match:
                          insert_pos = head_match.end()
                          content = content[:insert_pos] + '\n' + HEAD_SNIPPET + content[insert_pos:]
                      else:
                          print(f"WARNING: no <head> found in {fpath}, skipping GTM head snippet")

                      body_match = re.search(r'(<body[^>]*>)', content, re.IGNORECASE)
                      if body_match:
                          insert_pos = body_match.end()
                          content = content[:insert_pos] + '\n' + BODY_SNIPPET + content[insert_pos:]
                      else:
                          print(f"WARNING: no <body> found in {fpath}, skipping GTM body snippet")
                  else:
                      print(f"SKIP GTM (already present): {fpath}")

                  # --- HubSpot check ---
                  if HS_SCRIPT_ID not in content:
                      # HubSpot snippet missing: insert before </body>
                      body_close = re.search(r'(</body>)', content, re.IGNORECASE)
                      if body_close:
                          insert_pos = body_close.start()
                          content = content[:insert_pos] + HS_SNIPPET + '\n' + content[insert_pos:]
                          print(f"HUBSPOT ADDED: {fpath}")
                      else:
                          print(f"WARNING: no </body> found in {fpath}, skipping HubSpot snippet")
                  else:
                      # HubSpot tag present — check if src is broken (relative path)
                      broken_hs = re.search(
                          r'(<script[^>]+id=["\']hs-script-loader["\'][^>]+src=["\'])(\.\./js-eu1[^"\'>]+)(["\'])',
                          content, re.IGNORECASE
                      )
                      if broken_hs:
                          content = content[:broken_hs.start(2)] + HS_CORRECT_SRC + content[broken_hs.end(2):]
                          print(f"HUBSPOT FIXED (broken src): {fpath}")
                      else:
                          print(f"SKIP HubSpot (already correct): {fpath}")

                  if content != original:
                      with open(fpath, 'w', encoding='utf-8') as f:
                          f.write(content)
                      print(f"MODIFIED: {fpath}")
                      modified.append(fpath)

          print(f"\nTotal files modified: {len(modified)}")
          PYEOF

      - name: Commit modified HTML files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "GTM + HubSpot: auto-ajout snippets sur les pages HTML"
            git push origin preprod
          fi
