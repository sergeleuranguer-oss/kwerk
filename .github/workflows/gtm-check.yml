name: Build (GTM safety-net + partials injection)

on:
  push:
    branches:
      - preprod

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: preprod
          token: ${{ secrets.GITHUB_TOKEN }}

      # GTM uniquement : HubSpot vient du partial `scripts`, Axeptio est chargé PAR GTM
      # (ne jamais inliner Axeptio -> double-chargement).
      - name: Ensure GTM container on all pages
        run: python3 build/inject_gtm.py

      - name: Inject shared partials (header / nav / menu / footer / scripts)
        run: python3 build/inject_partials.py

      - name: Commit regenerated HTML files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "build: GTM + injection des partials communs"
            git push origin preprod
          fi
